<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Grove">
  <title>Grove</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#238636"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#56D364"/>
      <stop offset="0.55" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#2EA043"/>
    </radialGradient>
  </defs>

  <!-- branch edges (a git-style tree / DAG) -->
  <g stroke="url(#edge)" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M128 58 L78 130"/>
    <path d="M128 58 L182 130"/>
    <path d="M78 130 L46 202"/>
    <path d="M78 130 L112 202"/>
    <path d="M182 130 L146 202"/>
    <path d="M182 130 L212 202"/>
  </g>

  <!-- nodes (commits / repos) -->
  <g>
    <circle cx="128" cy="52" r="20" fill="url(#node)"/>
    <circle cx="78"  cy="130" r="16" fill="url(#node)"/>
    <circle cx="182" cy="130" r="16" fill="url(#node)"/>
    <circle cx="46"  cy="206" r="13" fill="url(#node)"/>
    <circle cx="112" cy="206" r="13" fill="url(#node)"/>
    <circle cx="146" cy="206" r="13" fill="url(#node)"/>
    <circle cx="212" cy="206" r="13" fill="url(#node)"/>
  </g>
</svg>
