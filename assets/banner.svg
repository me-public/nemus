<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Grove — multi-repo workspaces for the AI-agent era">
  <title>Grove</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#2EA043" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2EA043" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#238636"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#56D364"/>
      <stop offset="0.55" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#2EA043"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- wordmark + tagline -->
  <text x="96" y="150" font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="112" font-weight="700" letter-spacing="-3" fill="#E6EDF3">Grove</text>
  <text x="100" y="204" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#7EE2A8">Multi-repo workspaces for the AI-agent era</text>

  <!-- terminal window -->
  <g transform="translate(96,258)">
    <rect x="0" y="0" width="620" height="300" rx="16" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <rect x="0" y="0" width="620" height="44" rx="16" fill="#0D1117"/>
    <rect x="0" y="28" width="620" height="16" fill="#0D1117"/>
    <circle cx="26" cy="22" r="7" fill="#FF5F56"/>
    <circle cx="50" cy="22" r="7" fill="#FFBD2E"/>
    <circle cx="74" cy="22" r="7" fill="#27C93F"/>
    <text x="310" y="27" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#7D8590">grove</text>

    <g font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="22">
      <text x="30" y="98"  fill="#7EE2A8">$ <tspan fill="#E6EDF3">grove create payments</tspan></text>
      <text x="30" y="140" fill="#7D8590">✓ cloned 12 repositories</text>
      <text x="30" y="182" fill="#7D8590">✓ wrote AGENTS.md · installed skills</text>
      <text x="30" y="224" fill="#7EE2A8">$ <tspan fill="#E6EDF3">grove -- "start the checkout refactor"</tspan></text>
      <text x="30" y="266" fill="#3FB950">▸ launching agent<tspan fill="#3FB950">█</tspan></text>
    </g>
  </g>

  <!-- mark on the right -->
  <g transform="translate(880,150) scale(1.5)">
    <g stroke="url(#edge)" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M128 58 L78 130"/>
      <path d="M128 58 L182 130"/>
      <path d="M78 130 L46 202"/>
      <path d="M78 130 L112 202"/>
      <path d="M182 130 L146 202"/>
      <path d="M182 130 L212 202"/>
    </g>
    <g fill="url(#node)">
      <circle cx="128" cy="52" r="20"/>
      <circle cx="78"  cy="130" r="16"/>
      <circle cx="182" cy="130" r="16"/>
      <circle cx="46"  cy="206" r="13"/>
      <circle cx="112" cy="206" r="13"/>
      <circle cx="146" cy="206" r="13"/>
      <circle cx="212" cy="206" r="13"/>
    </g>
  </g>
</svg>
