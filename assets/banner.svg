<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Grove — multi-repo workspaces for the AI-agent era">
  <title>Grove</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4332"/>
      <stop offset="0.55" stop-color="#245B3B"/>
      <stop offset="1" stop-color="#2E7D48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#57C77E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#57C77E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- large mark on the right -->
  <g transform="translate(830,150) scale(1.4)">
    <rect x="85" y="150" width="12" height="50" rx="6" fill="#0F2C1E"/>
    <circle cx="91" cy="110" r="46" fill="#2E7D48"/>
    <circle cx="78" cy="98" r="16" fill="#57C77E" opacity="0.7"/>
    <rect x="184" y="160" width="11" height="40" rx="5.5" fill="#0F2C1E"/>
    <circle cx="189" cy="128" r="35" fill="#57C77E"/>
    <circle cx="199" cy="119" r="12" fill="#A7E0BE" opacity="0.7"/>
    <rect x="132" y="138" width="14" height="62" rx="7" fill="#0F2C1E"/>
    <circle cx="139" cy="92" r="56" fill="#173D2B"/>
    <circle cx="139" cy="92" r="52" fill="#3DA35D"/>
    <circle cx="122" cy="76" r="18" fill="#A7E0BE" opacity="0.8"/>
    <path d="M56 214 l16 12 -16 12" fill="none" stroke="#A7E0BE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="230" width="30" height="9" rx="4.5" fill="#A7E0BE"/>
  </g>

  <!-- wordmark + tagline on the left -->
  <text x="96" y="312" font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="150" font-weight="700" letter-spacing="-4" fill="#F7FFF9">Grove</text>
  <text x="100" y="378" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="500" fill="#A7E0BE">Multi-repo workspaces for the AI-agent era</text>
  <text x="100" y="440" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#7CD79B">$ npm install -g grove-cli</text>
</svg>
