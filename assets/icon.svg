<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Nemus icon">
  <title>Nemus</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#238636" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#238636" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inode" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#56D364"/>
      <stop offset="0.55" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#2EA043"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#tile)" stroke="#30363D" stroke-width="2"/>
  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#glow)"/>

  <!-- terminal traffic lights -->
  <circle cx="46" cy="44" r="7" fill="#FF5F56"/>
  <circle cx="70" cy="44" r="7" fill="#FFBD2E"/>
  <circle cx="94" cy="44" r="7" fill="#27C93F"/>

  <!-- tree glyph, centered lower -->
  <g transform="translate(0,20)">
    <g stroke="#238636" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M128 74 L86 134"/>
      <path d="M128 74 L170 134"/>
      <path d="M86 134 L60 192"/>
      <path d="M86 134 L112 192"/>
      <path d="M170 134 L144 192"/>
      <path d="M170 134 L196 192"/>
    </g>
    <g fill="url(#inode)">
      <circle cx="128" cy="70" r="17"/>
      <circle cx="86"  cy="134" r="13"/>
      <circle cx="170" cy="134" r="13"/>
      <circle cx="60"  cy="196" r="11"/>
      <circle cx="112" cy="196" r="11"/>
      <circle cx="144" cy="196" r="11"/>
      <circle cx="196" cy="196" r="11"/>
    </g>
  </g>
</svg>
