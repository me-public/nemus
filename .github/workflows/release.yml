name: Release

# Publishes nemus to npm and creates a GitHub Release.
#
# Trigger: a push to main that changes package.json's version, OR a manual
# workflow_dispatch. The actual publish runs in the `release` GitHub Environment,
# which is configured with REQUIRED REVIEWERS — so publishing always waits for a
# maintainer to click "Approve" before any package is pushed to npm.

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release?'
        required: false
        default: 'manual release'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) Decide whether there is a new version to publish.
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so we can diff the whole push, not just HEAD~1
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Compare against the commit BEFORE the whole push (github.event.before),
          # not HEAD~1 — a push can carry several commits, and if the version bump
          # isn't the last one, HEAD~1 already shows the new version and the
          # release would be silently skipped. `before` is all-zeros on a new
          # branch (nothing prior) -> treat as a release.
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            PREV=none
          else
            git show "$BEFORE:package.json" > /tmp/prev.json 2>/dev/null || echo '{}' > /tmp/prev.json
            PREV=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/prev.json','utf8')).version || 'none'")
          fi
          echo "previous=$PREV current=$VERSION"
          if [ "$VERSION" != "$PREV" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  # 2) Build + test as a gate before we ever ask for approval.
  verify:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-lock-version.js
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  # 3) Publish — runs ONLY after a maintainer approves the `release` environment.
  publish:
    needs: [detect, verify]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@nemus-cli/nemus
    permissions:
      contents: write   # create tag + GitHub Release
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Publish to npm (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # Idempotent: a re-run/re-approval (esp. via workflow_dispatch, which
          # always sets should_release=true) must not die on npm's
          # "cannot publish over an existing version" — mirror the GitHub Release
          # step's idempotency and no-op if this version is already on npm.
          if npm view "@nemus-cli/nemus@$VERSION" version >/dev/null 2>&1; then
            echo "@nemus-cli/nemus@$VERSION is already on npm — skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

      # Use the pre-installed GitHub CLI instead of a third-party action, so this
      # stays within the org's "GitHub-owned actions only" policy. Idempotent:
      # creates the release, or updates notes if the tag/release already exists.
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          NOTES=$(printf '## Nemus v%s\n\n```bash\nnpm install -g @nemus-cli/nemus@%s\n```\n\nSee the [CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' "$VERSION" "$VERSION" "$GITHUB_REPOSITORY")
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "Nemus v$VERSION" --notes "$NOTES" --draft=false --prerelease=false
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "Nemus v$VERSION" --notes "$NOTES" --latest
          fi
